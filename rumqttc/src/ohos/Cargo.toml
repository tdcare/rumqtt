[package]
name = "rumqttc-ohos-example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-ohos = { version = "1.1", features = ["async"] }
napi-derive-ohos = "1.1"
rumqttc = { path = "../../", default-features = false, features = ["websocket", "use-rustls"] }
url = "2.5"
ohos-hilog-binding = "0.1"

[build-dependencies]
napi-build-ohos = "1.1"

[features]
default = ["napi-ohos/default"]
